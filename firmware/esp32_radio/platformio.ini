; PlatformIO project for the mouse-side ESP32-C3 Super Mini radio.
; Transparent UART <-> ESP-NOW bridge: Serial5 on the Teensy Main MCU talks to
; UART1 here (TX=21, RX=20, 460800 baud), and every byte is relayed over
; ESP-NOW to the laptop-side radio (LAPTOP_MAC). See ../lib_shared/EspNowLink.

[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib_shared
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB CDC (debug banner only)
