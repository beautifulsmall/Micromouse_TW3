; PlatformIO project for the laptop-side ESP32-C3 Super Mini radio (USB dongle).
; Transparent USB-serial <-> ESP-NOW bridge: the laptop's serial monitor talks
; to this board over native USB, and every byte is relayed over ESP-NOW to the
; mouse-side radio (MOUSE_MAC). See ../lib_shared/EspNowLink.

[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 460800   ; matches the Teensy console baud carried over the link
lib_extra_dirs = ../lib_shared
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB CDC to the laptop
