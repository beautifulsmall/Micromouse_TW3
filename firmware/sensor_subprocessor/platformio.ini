; PlatformIO project for the Sensor sub-processor (Teensy 4.0).
;
; Reads the 4x S15366-256 laser triangulation sensors and streams 5-byte wall
; packets to the Main MCU over Serial5 (pins 20/21) @ 460800 -- see the sketch
; header for the command/packet protocol. Open THIS folder in the PlatformIO
; IDE (VS Code) and upload, exactly like ../main_mcu.
;
; The firmware is kept as the original Arduino sketch (src/*.ino). PlatformIO
; runs the same Arduino preprocessing the Arduino IDE does, so the code is
; byte-for-byte the working sketch -- no conversion, nothing to re-verify.

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200   ; USB calibration console (Serial.begin(115200) in setup)
