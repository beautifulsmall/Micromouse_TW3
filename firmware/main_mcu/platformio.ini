; PlatformIO project for the Main MCU (Teensy 4.0).
;
; Layering per ../../docs/firmware_architecture_adr.md:
;   HAL -> Drivers -> Control -> Application
; Each layer lives in lib/<Layer>/ and is auto-linked by PlatformIO's library
; dependency finder; src/main.cpp is the entry point and the bench console.
;
;   pio run              build
;   pio run -t upload    build + flash the Teensy
;   pio device monitor   115200 baud console
;
; The host-side unit tests are NOT run through PlatformIO -- they are plain
; g++ builds so they need no toolchain beyond a compiler. Run them with
; test/run_tests.sh (see test/README.md).

; THE DEFAULT ENV (2026-09-15). Without this, `pio run -t upload` builds
; and uploads EVERY env in this file in order -- teensy40, then
; teensy40_fram8 -- and the mouse ends up with the 8 Mbit layout on the
; 4 Mbit chip: fram_init probes 512 KB, refuses ("FRAM missing"), and the
; mouse flies on compiled defaults with no LUTs, no map, no log (D9,
; 2026-09-15: "hit first post at V"). Nothing in FRAM is touched when it
; refuses; reflashing this env brings everything back.
[platformio]
default_envs = teensy40

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall

; The 8 Mbit (1M x 8) Infineon FRAM build (bert, 2026-09-13). Same code,
; FRAM_MBIT=8 lays the FRAM map out over 1 MB (Fram.h): the flight log
; region doubles and the lap report block moves to the new top. fram_init
; refuses to run this build on the 4 Mbit chip (it probes the size), so
; the wrong build cannot scribble two blocks onto the same bytes.
;   pio run -e teensy40_fram8 -t upload      (explicit -e: it is NOT a default)
; Migration: 'FRAM backup' in the GUI on the old chip and firmware, fit the
; new chip, flash THIS env, 'FRAM restore', power cycle.
[env:teensy40_fram8]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DFRAM_MBIT=8
