<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TW3 Flight Viewer</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #14161a; color: #d8dce2; }
  #bar { padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
         background: #1d2026; border-bottom: 1px solid #2c313a; }
  #bar label { font-size: 13px; }
  button { background: #2c313a; color: #d8dce2; border: 1px solid #3a4150; border-radius: 4px;
           padding: 4px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #3a4150; }
  #seek { flex: 1 1 260px; }
  #runs { padding: 4px 12px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px;
          background: #1d2026; border-bottom: 1px solid #2c313a; }
  .runrow { display: flex; gap: 4px; align-items: center; }
  .sw { width: 10px; height: 10px; display: inline-block; border-radius: 2px; }
  .active { outline: 1px solid #d8dce2; }
  #readout { font: 12px/1.5 ui-monospace, monospace; padding: 6px 12px; white-space: pre;
             background: #1d2026; border-bottom: 1px solid #2c313a; }
  #sweepinfo { font: 11px/1.45 ui-monospace, monospace; padding: 6px 12px; white-space: pre;
               background: #191c22; border-bottom: 1px solid #2c313a; color: #a8b2c0;
               max-height: 150px; overflow: auto; }
  canvas { background: #14161a; display: block; }
  /* Maze and chart side by side, maze first (2026-09-25). The row fills
     the window below the bars; the bar between the two drags the split. */
  #row { display: flex; align-items: stretch; }
  #cv { flex: none; }
  #splitter { flex: none; width: 6px; cursor: col-resize; background: #2c313a; }
  #splitter:hover { background: #3a4150; }
  #chartcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
  #chart { flex: 1 1 0; border-left: 1px solid #2c313a; }
  #chartbar { padding: 4px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
              font-size: 12px; background: #1d2026; border-bottom: 1px solid #2c313a; }
  #chartbar .chip { display: inline-flex; gap: 3px; align-items: center; padding: 1px 6px;
                    border: 1px solid #3a4150; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>
<div id="bar">
  <input type="file" id="file" accept=".txt,.csv,.log" multiple>
  <button id="clear">Clear</button>
  <button id="play">Play</button>
  <button id="stepb">−1</button>
  <button id="stepf">+1</button>
  <label>speed <select id="spd">
    <option value="0.1">0.1x</option><option value="0.25">0.25x</option>
    <option value="0.5" selected>0.5x</option><option value="1">1x</option>
    <option value="2">2x</option></select></label>
  <input type="range" id="seek" min="0" max="0" value="0">
  <label><input type="checkbox" id="ckTrail" checked>trails</label>
  <label><input type="checkbox" id="ckBeams" checked>beams</label>
  <label><input type="checkbox" id="ckCloud" checked>wall cloud</label>
  <label title="Only paint hits taken while the mouse was within 12 deg of axis-aligned. Off-axis hits cannot be placed correctly -- see beamRange()."><input type="checkbox" id="ckSquare" checked>square hits only</label>
  <label title="Draw the wall the MAP predicted each side beam was measuring (from the on-board raycast). A prediction sitting on a different wall than the hit is a mis-association."><input type="checkbox" id="ckPred">predicted walls</label>
  <label title="Sweep dumps only: the path the mouse was TOLD to fly, from the loop's radius and the ring geometry. The gap between this and the trail at a corner exit IS the number the whole experiment is about."><input type="checkbox" id="ckIdeal" checked>commanded path</label>
  <label title="Sweep dumps only: rotate and translate all four corners into corner 0's frame so they lie on top of each other. A rigid transform, so shape, exit offset and heading error are unchanged -- it just puts 4 corners x every loaded loop in one place. Spread between the folded wall clouds is the hand-built ring's own unevenness, measured."><input type="checkbox" id="ckFold">fold corners</label>
  <label title="Which channel the folded chart draws, every corner of every visible loop on one arc-relative axis.">fold plot <select id="foldCh">
    <option value="lat" selected>lateral</option>
    <option value="ay">ay</option>
    <option value="dfc">ay − a_dem</option>
    <option value="yerr">yaw_err</option>
    <option value="om">omega</option></select></label>
  <label><input type="checkbox" id="ckGhost" checked>ghosts</label>
  <label><input type="checkbox" id="ckGrid" checked>180 grid</label>
  <label title="How to read the FRONT beam byte. ON = forward distance from the MOUSE CENTRE (45 mm at contact), which is what the sub-MCU front auto-cal 'C' produces and what the mouse uses now. OFF = along-beam range from the sensor face, the pre-auto-cal convention (logs ~055/056). Auto-detected per run from the LUT floor where the data shows it; this box is the fallback and the override."><input type="checkbox" id="ckFrontC" checked>front from centre</label>
  <label title="Angle pointer at the cursor: solid ray = heading now, dashed ray = the local trend of that heading over ~240 mm, wedge between them = the wobble. Read 'off trend' against 'yaw_err': off-trend bigger means the PATH is wandering and the mouse is following it faithfully."><input type="checkbox" id="ckAngle" checked>angle pointer</label>
  <label title="Mouse centre y at the start, mm from the maze edge. 51 = back to the rear wall (6 mm wall face + 45 mm half body). 90 = old centre-of-cell placement, for logs before 2026-07-28."
    >start y <input type="number" id="startY" value="51" min="0" max="180" step="1" style="width:56px"></label>
  <button id="fit">Fit</button>
  <span style="color:#6b7280;font-size:12px">scroll = zoom · drag = pan · dbl-click = fit</span>
</div>
<div id="runs">no runs loaded — pick one or more 'y' dump files (they overlay)</div>
<div id="readout"></div>
<div id="sweepinfo" style="display:none"></div>
<div id="row">
  <canvas id="cv" width="480" height="700"></canvas>
  <div id="splitter" title="drag to trade width between the maze and the chart; double-click resets"></div>
  <div id="chartcol">
    <div id="chartbar"></div>
    <canvas id="chart" width="700" height="600"></canvas>
  </div>
</div>
<script>
"use strict";
// Beam geometry (body frame: x fwd, y left; from the sensor sub-MCU).
const BEAMS = [
  { col: "L",  ox: 40, oy: -15, a:  72.8, color: "#e5c07b" },
  { col: "FL", ox: 28, oy:  -9, a:   8.4, color: "#61afef" },
  { col: "FR", ox: 28, oy:   9, a:  -9.6, color: "#61afef" },
  { col: "R",  ox: 40, oy:  15, a: -71.0, color: "#e06c75" },
];
// Logged byte -> along-beam range from the SENSOR, which is what the drawing
// code needs (it starts each ray at the sensor origin).
//
// THE FRONT CONVENTION CHANGED, so this function has to be told which era a
// log comes from. Both of these were true, at different times:
//
//   OLD ("face")   the byte is the along-beam range from the sensor FACE.
//                  Measured on runs 055/056: FL vs horizontal wall -2.5 mm
//                  (sd 7.6), FR -2.5. Correct for logs of that era.
//   NEW ("centre") the byte is the FORWARD distance from the MOUSE CENTRE to
//                  a perpendicular wall -- 45 mm at contact, which is half the
//                  body length. The sub-MCU front auto-cal ('C') bakes in both
//                  the 28 mm sensor offset and the beam angle. This is what
//                  the mouse does now; walls_evaluate passes the byte straight
//                  through as front_mm, and SEARCH_FRONT_TARGET_MM = 84 (cell
//                  centre to wall face) only makes sense this way.
//
// Drawing a NEW log with the OLD rule puts every front hit ~28 mm long, which
// is what "the front hits don't align with the walls" looks like (bert,
// 2026-08-14). The inverse for the new convention is (d - ox)/cos(a).
//
// Auto-detected per run from the LUT floor: in the centre convention nothing
// can read below ~45 (the nose is there), so a run that shows front values
// well under that is an old-era log. When a run never gets near a wall the
// evidence is absent and the checkbox default stands -- the run list says
// which rule was used either way, so it is never silent.
//
// SIDE is unchanged: the byte behaves as the PERPENDICULAR distance from the
// mouse centre -- the tight sd of 0.5-1.5 mm says convention, not noise -- so
// it still needs perp -> range: r = (perp + |oy|)/|sin a|.
//
// KNOWN LIMIT: "perpendicular from centre" only means anything for a side beam
// looking at the wall it runs alongside. When a side beam catches a HORIZONTAL
// wall through a doorway the conversion is meaningless and those hits stay
// 25-35 mm out. Nothing here can fix that -- the viewer does not know which
// wall a beam hit. Judge side channels on vertical walls, front on horizontal.
function beamRange(b, d, frontFromCentre) {
  const a = b.a * Math.PI / 180;
  if (b.col === "FL" || b.col === "FR") {
    if (!frontFromCentre) return d;            // old era: already a range
    const cs = Math.abs(Math.cos(a));
    return cs > 1e-3 ? (d - b.ox) / cs : d;    // forward-from-centre -> range
  }
  const sn = Math.abs(Math.sin(a));
  return sn > 1e-3 ? (d + Math.abs(b.oy)) / sn : d;
}

// Which front rule does this run want? Only the LUT floor can tell us, and
// only when the mouse got close enough to a wall to show it.
const FRONT_CONTACT_MM = 45;   // half the body length: the centre-convention floor
function detectFrontConv(rec) {
  // ONLY a reading below the contact distance is evidence, and it is evidence
  // of exactly one thing: the byte cannot be forward-from-centre, because the
  // mouse's own nose is at 45 mm. Anything above that is consistent with BOTH
  // conventions and proves nothing -- speed runs never stop at a wall, so the
  // floor is usually never exercised (measured: min front 50..140 across the
  // logs on disk). Returning "centre" on that would be asserting a convention
  // from an absence, which is how the stale front note survived as long as it
  // did. Unknown means unknown; the checkbox decides and the label says so.
  let lo = 999;
  for (const r of rec)
    for (const c of ["FL", "FR"]) {
      const d = r[c];
      if (d > 0 && d < 255 && d < lo) lo = d;
    }
  if (lo > 900) return { centre: null, why: "no front data — assumed" };
  if (lo < FRONT_CONTACT_MM - 6)
    return { centre: false,
             why: `min front ${lo} is inside the ${FRONT_CONTACT_MM} mm nose — measured: old (face)` };
  return { centre: null, why: `min front ${lo}, never near the floor — assumed` };
}
const CELL = 180;
// Start pose. The mouse is placed with its BACK TO THE REAR WALL, so its centre
// sits at 6 mm (wall face) + 45 mm (half of the 90 mm body, spec 3.1) = 51 mm,
// NOT at the cell centre. The firmware agrees as of 2026-07-28: the speed path
// carries a lead-in so s=0 is the real start pose, and the search's boot-align
// leg drives a cell plus the setback. Editable in the toolbar because logs
// recorded before that (and any centre-placed run) want 90.
const START_X = 90;
function startY() { return +document.getElementById("startY").value || 0; }
const PALETTE = ["#3fa65c","#c678dd","#56b6c2","#d19a66","#e06c75",
                 "#61afef","#98c379","#e5c07b"];
let runs = [];        // {name, color, rec[], pose[], hits[], visible}
let cur = 0;          // active run index
let idx = 0, playing = false;

// THE LAUNCH HEADING (bert, 2026-09-11: "the CCW data sets display
// misaligned with the CW set"). yaw in the log is relative to the launch
// heading, and the reconstruction used to assume every lap launched NORTH
// from the rear wall of (0,0). A CCW lap launches EAST from the west wall,
// so its trail came out rotated 90 degrees and translated onto the wrong
// datum. Resolution, in order: an explicit override (the N/E control on the
// run row), the banner's launch=N/E/S/W field (firmware from this date), and
// for older logs the launch-cell walls -- a north launch from (0,0) sees the
// west wall on the LEFT beam and nothing on the right (every rig's start
// cell opens east); an east launch sees the south wall on the RIGHT and
// nothing on the left.
function detectLaunch(text, rec) {
  const m = /launch=([NESW])/.exec(text);
  if (m) return { h: m[1], why: "banner" };
  let l = 0, r = 0, n = 0;
  for (const q of rec) {
    if (q.s > 30) break;
    n++;
    if (q.L !== 255 && q.L !== 0 && q.L < 130) l++;
    if (q.R !== 255 && q.R !== 0 && q.R < 130) r++;
  }
  if (n && l > n * 0.7 && r < n * 0.3) return { h: "N", why: "west wall on the left at launch" };
  if (n && r > n * 0.7 && l < n * 0.3) return { h: "E", why: "south wall on the right at launch" };
  return { h: "N", why: "assumed (no banner field, walls ambiguous)" };
}
// Start pose for a launch heading: the axle startY() from the rear wall
// that the back panel is pressed on, centred in the cell across it. yaw0 is
// added to every logged yaw (north 0, east -90, +CCW).
function launchPose(h) {
  const sy = startY();
  switch (h) {
    case "E": return { x: sy, y: START_X, yaw0: -90 };
    case "S": return { x: START_X, y: 180 - sy, yaw0: 180 };
    case "W": return { x: 180 - sy, y: START_X, yaw0: 90 };
    default:  return { x: START_X, y: sy, yaw0: 0 };
  }
}
function parseRun(name, text, launchOverride) {
  const rec = [], walls = [];   // walls: [x0,y0,x1,y1] world mm
  let fIdx = null;              // flight column map, from the t_ms header row
  let banner = "";
  for (const line of text.split(/\r?\n/)) {
    const p = line.trim().split(",");
    if (p[0] === "SETTINGS") { banner = line.trim().slice(9); continue; }
    // Exact map preamble (MAZE_V,i,mask / MAZE_H,i,mask): the searched
    // walls, so we draw ground truth instead of inferring from beams.
    // Guard against radio-garbled preamble lines: a bad index (e.g.
    // MAZE_V,9871,..) would place a wall at 1.8M mm and zoom the view to
    // nothing. Valid indices are 0..16 (17 grid lines), mask 0..0xFFFF.
    if (p[0] === "MAZE_V" && p.length === 3) {
      const i = +p[1], m = +p[2];
      if (i >= 0 && i <= 16 && m >= 0 && m <= 0xFFFF)
        for (let yb = 0; yb < 16; yb++)
          if (m & (1 << yb)) walls.push([i*180, yb*180, i*180, yb*180+180]);
      continue;
    }
    if (p[0] === "MAZE_H" && p.length === 3) {
      const i = +p[1], m = +p[2];
      if (i >= 0 && i <= 16 && m >= 0 && m <= 0xFFFF)
        for (let xb = 0; xb < 16; xb++)
          if (m & (1 << xb)) walls.push([xb*180, i*180, xb*180+180, i*180]);
      continue;
    }
    // HEADER-DRIVEN COLUMNS (2026-08-28). The dump's column set is dynamic
    // now -- all-zero optional columns are omitted per run (the firmware
    // names them on an OMITTED line) -- so nothing here may count positions.
    // The header row the dump always emits (t_ms,s,v,...) is parsed into a
    // name->index map and every field is read by NAME, absent columns taking
    // their honest defaults. This is the same policy the sweep parser has
    // used all along, and it reads every dump vintage: the old fixed 26-col
    // format carries the same header line. (The desync this fixed: dropping
    // `slide` shifted everything after `ax` one left, and the beam columns
    // displayed their neighbours' data.)
    if (p[0] === "t_ms") {
      fIdx = {};
      p.forEach((k2, i2) => { fIdx[k2.trim()] = i2; });
      continue;
    }
    if (p.length >= 10 && /^\d+$/.test(p[0]) && fIdx) {
      const g = (nm, dflt) => {
        const i2 = fIdx[nm];
        return (i2 !== undefined && i2 < p.length) ? +p[i2] : dflt;
      };
      // EVERY COLUMN, BY NAME (2026-09-25): the chart lets you plot any
      // logged channel, so the record keeps the whole row as well as the
      // named fields the map drawing uses.
      const c = {};
      for (const k2 in fIdx) { const i2 = fIdx[k2]; if (i2 < p.length) c[k2] = +p[i2]; }
      rec.push({
        c,
        t: g("t_ms", 0), s: g("s", 0), v: g("v", 0), yaw: g("yaw", 0),
        yerr: g("yaw_err", 0), ay: g("ay", 0), ax: g("ax", 0),
        slide: g("slide", 0), flags: g("flags", 0),
        L: g("L", 255), FL: g("FL", 255), FR: g("FR", 255), R: g("R", 255),
        wf: g("wf", 0), om: g("omega", 0),
        // PREDICTED WALL VECTOR: what the map said each side beam should be
        // looking at. axis 255 = none. Omitted on route runs.
        paxL: g("pax_l", 255), pcoL: g("pco_l", 0), prnL: g("prn_l", 255),
        paxR: g("pax_r", 255), pcoR: g("pco_r", 0), prnR: g("prn_r", 255),
        // observer's accumulated heading correction, deg
        ohead: g("obs_head", 0),
      });
    }
  }
  if (!rec.length) return null;
  // Physics reconstruction: step along fusion yaw (north 0 = +y, east -90 =
  // +x, +CCW; forward unit u = (-sin, cos)).
  //
  // DISTANCE BASIS = the `s` column, NOT the `v` column. `v` is the COMMANDED
  // velocity (FlightLog.h: "commanded velocity"), so integrating it gives the
  // reference trajectory, and the mouse LAGS that reference -- the gap builds
  // through the launch ramp and holds at cruise, worth ~50-60 mm by the time
  // the run is up to speed. That lag was being drawn as real distance and it
  // pushed the whole wall cloud forward. `s` is control's fused path position
  // ("fused + corrections"), i.e. the mouse's measured travel, which is what
  // the reconstruction actually wants.
  // Front convention for THIS run, before any hit is placed.
  const fc = detectFrontConv(rec);
  const frontFromCentre = fc.centre === null
    ? (document.getElementById("ckFrontC") || { checked: true }).checked
    : fc.centre;

  const det = detectLaunch(text, rec);
  const launch = launchOverride || det.h;
  const lp = launchPose(launch);
  const pose = [], hits = [];
  let x = lp.x, y = lp.y;
  for (let i = 0; i < rec.length; i++) {
    const r = rec[i];
    if (i > 0) {
      let ds = r.s - rec[i-1].s;
      // A TWO-LEG RUN (banner route:S->G|G->S, flags bit6 on the home leg):
      // the mouse stops at the goal, turns in place, and the home leg's s
      // restarts at 0 from the goal cell's centre. The yaw frame is
      // continuous across the turn (nothing re-zeroes the fusion between
      // legs), so the only thing to do at the boundary is not to step
      // backwards by the whole out leg.
      if (ds < -50) ds = Math.max(0, r.s);
      const th = (r.yaw + lp.yaw0) * Math.PI / 180;
      x += ds * -Math.sin(th);
      y += ds * Math.cos(th);
    }
    const th = (r.yaw + lp.yaw0) * Math.PI / 180;
    pose.push({ x, y, th });
    const c = Math.cos(th), s2 = Math.sin(th);
    // How far from axis-aligned the mouse was, 0..45 deg. Both beam models
    // assume the wall is square to the mouse (the side conversion literally
    // assumes the wall runs ALONGSIDE it), so a hit taken mid-diagonal or
    // mid-corner cannot be placed correctly. Measured on 055/056 against the
    // map preamble, hits landing on horizontal walls:
    //     side channels, <10 deg off-axis   n=725  mean  +3.4 mm
    //     side channels, 10-45 deg off-axis n=339  mean +36.0 mm
    //     front channels, <10 deg off-axis  n=424  mean  +5.5 mm
    //     front channels, 10-45 deg off     n= 85  mean +21.0 mm
    // 68% of the horizontal-wall cloud comes from the SIDE channels, and the
    // off-axis part of it is what makes horizontal walls look displaced. The
    // 'square hits only' box drops them rather than drawing them somewhere
    // they are not. The cloud goes quiet through diagonals -- that is honest;
    // the viewer does not know which wall an oblique beam hit.
    const off = Math.abs((((r.yaw + lp.yaw0 + 45) % 90) + 90) % 90 - 45);
    for (const b of BEAMS) {
      const d = r[b.col];
      if (d === 255 || d === 0 || d === undefined) continue;
      const bx = x + b.ox * -s2 + b.oy * -c;
      const by = y + b.ox * c + b.oy * -s2;
      const ba = th + b.a * Math.PI / 180;
      const rb = beamRange(b, d, frontFromCentre);
      hits.push({ x: bx + rb * -Math.sin(ba), y: by + rb * Math.cos(ba),
                  i, color: b.color, off });
    }
  }
  // ---- ANGLE DATA: yaw against its own LOCAL TREND -----------------------
  //
  // The number this exists for. On a diagonal, yaw is supposed to sit at a
  // constant -135, so any wobble on top of the trend is the path (or the
  // tracker) wandering. Fitting the trend over a sliding window of TRAVEL --
  // not of records -- keeps it honest when the mouse slows down, and
  // subtracting it leaves the wobble alone.
  //
  // Read it NEXT TO yaw_err, which is the point: yaw_err is how far the mouse
  // is from what it was TOLD. If yaw wobbles and yaw_err does not, the mouse
  // is faithfully tracking a reference that is itself wobbling -- the log 069
  // lesson, and how 081's diagonal was diagnosed:
  //     081, s 1101..1999   yaw about trend rms 5.08 deg, peak 8.15
  //                         yaw_err            rms 2.68 deg, max  4.80
  //                         wobble period      254 mm
  //     diagonal cell pitch 180*sqrt(2)      = 254.6 mm
  // Same number. The band was scalloping once per lattice post, because
  // dclr=70 asks for more clearance than a diagonal passage has: two opposing
  // posts leave 127.3 mm between them, so 55.1 mm from the centreline is all
  // there is, and 70 cannot be honoured on both sides at once.
  trendFit(rec);

  // What kind of log this is, from the banner: the slip test re-purposes
  // columns (v = wheel, obs_along = v_imu, obs_cross = v_ref, omega = v_abs)
  // and the chart names them accordingly.
  const logkind = /^slip:/.test(banner) ? "slip" : /^lat:/.test(banner) ? "lat"
                : /^search:/.test(banner) ? "search" : "route";
  deriveChannels(rec, logkind);
  // keep the source text so changing the start pose can rebuild without a reload
  return { name, text, rec, pose, hits, walls, visible: true, banner, logkind,
           frontFromCentre, frontWhy: fc.why,
           launch, launchWhy: launchOverride ? "set by hand" : det.why,
           launchOverride: launchOverride || null,
           color: PALETTE[runs.length % PALETTE.length] };
}

// ---- DERIVED CHANNELS (bert, 2026-09-25: "selectable data from any data
// in the flight log; if acceleration isn't logged it can be calculated
// from other data, odometry and IMU -- that's the plot that will show the
// ABS firing"). Each record gets a `d` map of computed channels next to its
// `c` map of logged ones. Derivatives are central differences over a +/-3
// record window on the log's own t_ms, so a decimated log still gives a
// usable accel; the IMU's ax is logged directly and sits beside them.
function deriveChannels(rec, kind) {
  const n = rec.length;
  // +/-8 records (~25 ms at the packet rate): the encoder velocity is noisy
  // enough that a tighter window is unreadable, and 25 ms still resolves a
  // 10 ms ABS episode's effect on the wheel.
  const ddt = (get, i) => {
    const a = Math.max(0, i - 8), b = Math.min(n - 1, i + 8);
    const dt = (rec[b].t - rec[a].t) / 1000;
    return dt > 0 ? (get(rec[b]) - get(rec[a])) / dt : 0;
  };
  for (let i = 0; i < n; i++) {
    const r = rec[i], c = r.c, d = {};
    d["dv/dt"] = ddt(z => z.v, i);              // wheel accel (slip) / commanded accel (route)
    d["ds/dt"] = ddt(z => z.s, i);              // speed from the distance column
    if (kind === "slip") {
      const vimu = c.obs_along || 0, vref = c.obs_cross || 0, vabs = c.omega || 0;
      d["v_imu"] = vimu; d["v_ref"] = vref; d["v_abs"] = vabs;
      d["v-v_imu"] = r.v - vimu;
